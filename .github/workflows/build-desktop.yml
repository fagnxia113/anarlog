name: Desktop CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_NET_RETRY: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm --filter @zhiji/desktop install --frozen-lockfile

      - name: Build frontend
        run: pnpm -F @zhiji/desktop build

      - name: Build Tauri app
        run: pnpm exec tauri build --ci --bundles nsis --no-sign
        working-directory: apps/desktop

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: zhiji-windows-nsis
          path: apps/desktop/src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error
