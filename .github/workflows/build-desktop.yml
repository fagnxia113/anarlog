name: Desktop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build UI package
        run: pnpm -F @hypr/ui build

      - name: Build frontend
        run: pnpm -F @hypr/desktop build

      - name: Build Tauri app
        run: pnpm exec tauri build --ci --bundles nsis --no-sign --target x86_64-pc-windows-msvc --config ./src-tauri/tauri.conf.staging.json --features devtools
        working-directory: apps/desktop
        env:
          POSTHOG_API_KEY: phc_local_smoke
          VITE_API_URL: https://api.anarlog.so

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: apps/desktop/src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error