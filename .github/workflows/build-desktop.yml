name: Desktop CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "refactor/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CARGO_NET_RETRY: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm --filter @zhiji/desktop install --no-frozen-lockfile

      - name: Bundle local Chinese ASR runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "funasr-runtime.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "funasr-runtime"
          $target = "apps/desktop/src-tauri/resources/funasr-runtime"
          Invoke-WebRequest -Uri "https://github.com/modelscope/FunASR/releases/download/runtime-llamacpp-v0.1.9/funasr-llamacpp-windows-x64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $unpacked -Force
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $executable = Get-ChildItem -Path $unpacked -Recurse -Filter "llama-funasr-sensevoice.exe" | Select-Object -First 1
          if ($null -eq $executable) { throw "FunASR runtime executable was not found" }
          Copy-Item -Path (Join-Path $executable.Directory.FullName "*") -Destination $target -Recurse -Force

      - name: Bundle audio conversion runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "ffmpeg"
          $target = "apps/desktop/src-tauri/resources/ffmpeg"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $unpacked -Force
          $executable = Get-ChildItem -Path $unpacked -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($null -eq $executable) { throw "FFmpeg executable was not found" }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path $executable.FullName -Destination (Join-Path $target "ffmpeg.exe") -Force

      - name: Bundle Visual C++ runtime for local speaker engine
        shell: pwsh
        run: |
          $target = "apps/desktop/src-tauri/resources/vcrt"
          $runtimeDlls = @(
            "concrt140.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll", "msvcp140_codecvt_ids.dll", "vcomp140.dll",
            "vcruntime140.dll", "vcruntime140_1.dll"
          )
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($dll in $runtimeDlls) {
            $source = Join-Path $env:WINDIR "System32/$dll"
            if (-not (Test-Path $source)) { throw "Visual C++ runtime file was not found: $source" }
            Copy-Item -Path $source -Destination (Join-Path $target $dll) -Force
          }

      - name: Verify signing key is present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is EMPTY. The GitHub Secret is missing or misnamed (must be exactly 'TAURI_SIGNING_PRIVATE_KEY')."
          }
          Write-Host "Signing key env present (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length))."

      - name: Build (tauri-action, no release)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          includeRelease: false
          args: "--ci --bundles nsis --no-sign"

      - name: Sign updater artifacts and publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          # tauri-action builds into the cargo workspace target dir; locate the installer recursively
          $exe = Get-ChildItem -Path "." -Recurse -Filter "*_${version}_x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path "." -Recurse -Filter "*x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { throw "Installer .exe not found anywhere under repo root" }
          Write-Host "Found installer: $($exe.FullName)"
          $keyFile = Join-Path $env:RUNNER_TEMP "zhiji_sign.key"
          [System.IO.File]::WriteAllText($keyFile, $env:TAURI_SIGNING_PRIVATE_KEY)
          Write-Host "Signing installer with updater private key..."
          pnpm --filter @zhiji/desktop exec tauri signer sign --private-key $keyFile $exe.FullName
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "Updater signature (.sig) was not generated" }
          $signature = (Get-Content -Raw "$($exe.FullName).sig").Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"
          $latest = [ordered]@{
            version  = "${{ github.ref_name }}"
            notes    = "自动更新版本。安装此 NSIS 包后，后续版本将在应用内自动更新。"
            pub_date = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $url
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path "latest.json" -Encoding utf8
          Write-Host "Creating release ${{ github.ref_name }} and uploading .exe + .sig + latest.json..."
          gh release create "${{ github.ref_name }}" `
            --title "知记 v$version" `
            --notes "自动更新版本。安装此 NSIS 包后，后续版本将在应用内自动更新。" `
            --latest `
            "$($exe.FullName)" "$($exe.FullName).sig" "latest.json"
          Write-Host "RELEASE PUBLISHED with .exe + .sig + latest.json"
