name: Build Windows App

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "plugins/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "plugins/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: pwsh
        run: |
          $storePath = pnpm store path
          "STORE_PATH=$storePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm -F ui build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/target/release
            apps/desktop/src-tauri/target/*.json
          key: ${{ runner.os }}-cargo-build-desktop-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-desktop-

      - name: Build frontend
        run: pnpm -F @hypr/desktop build

      - name: Clean stale bundle artifacts from cache
        shell: pwsh
        run: |
          $staleDirs = @(
            "apps/desktop/src-tauri/target/release/bundle",
            "apps/desktop/src-tauri/target/release/nsis",
            "apps/desktop/src-tauri/target/release/wix"
          )
          foreach ($d in $staleDirs) {
            if (Test-Path $d) {
              Write-Host "Removing stale: $d"
              Remove-Item -Recurse -Force $d
            }
          }

      - name: Copy VC runtime DLLs
        shell: pwsh
        run: |
          $destDir = "apps/desktop/src-tauri/resources/vcrt"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $sys32 = "${env:windir}\System32"
          $dlls = @("msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $dlls) {
            $src = Join-Path $sys32 $dll
            if (Test-Path $src) {
              Copy-Item $src $destDir
              Write-Host "Copied: $dll"
            } else {
              Write-Host "NOT found: $dll in $sys32"
              throw "Cannot find $dll"
            }
          }
          Write-Host "Bundled VC runtime DLLs:"
          Get-ChildItem $destDir | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Build Tauri app (Windows)
        working-directory: apps/desktop
        run: pnpm tauri build --ci --no-sign --verbose
        env:
          POSTHOG_API_KEY: phc_windows_ci
          VITE_POSTHOG_API_KEY: phc_windows_ci
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_HYPRNOTE_2 }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: https://anarlog.so
          VITE_API_URL: https://api.anarlog.so
          VITE_PRO_PRODUCT_ID: ${{ secrets.VITE_PRO_PRODUCT_ID }}

      - name: Check exe dependencies
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/target/release/anarlog-dev.exe"
          if (Test-Path $exe) {
            Write-Host "=== Exe DLL dependencies ==="
            & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dumpbin) {
              & $dumpbin.FullName /dependents $exe
            } else {
              Write-Host "dumpbin not found, skipping dependency check"
            }
          }

      - name: List build artifacts
        shell: pwsh
        run: |
          Write-Host "=== Bundle directory ==="
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Print NSIS installer script
        shell: pwsh
        run: |
          $nsiFile = "apps/desktop/src-tauri/target/release/nsis/x64/installer.nsi"
          if (Test-Path $nsiFile) {
            Write-Host "=== installer.nsi (resources/File lines) ==="
            Get-Content $nsiFile | Where-Object { $_ -match "(File|Resource|msvcp|vcruntime|vcrt|\\\$INSTDIR)" } | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "=== Full installer.nsi path: $nsiFile ==="
          } else {
            Write-Host "installer.nsi not found at $nsiFile"
          }

      - name: Verify NSIS installer contents (7-zip extraction)
        shell: pwsh
        run: |
          $nsisExe = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsisExe) {
            Write-Host "No NSIS installer found"
            exit 1
          }
          Write-Host "=== NSIS installer: $($nsisExe.Name) ==="
          Write-Host "Size: $([math]::Round($nsisExe.Length / 1MB, 2)) MB"
          Write-Host "LastWriteTime: $($nsisExe.LastWriteTime)"

          $tempExtract = "D:\temp-nsis-extract"
          if (Test-Path $tempExtract) { Remove-Item -Recurse -Force $tempExtract }
          & 7z x $nsisExe.FullName -o"$tempExtract" -y | Out-Null

          Write-Host "=== Extracted files ==="
          Get-ChildItem -Path $tempExtract -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host ""
          Write-Host "=== Checking for VC runtime DLLs ==="
          $dlls = @("msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          $allFound = $true
          foreach ($dll in $dlls) {
            $found = Get-ChildItem -Path $tempExtract -Recurse -Filter $dll -ErrorAction SilentlyContinue
            if ($found) {
              Write-Host "  FOUND: $dll at $($found.FullName)"
            } else {
              Write-Host "  MISSING: $dll"
              $allFound = $false
            }
          }
          if (-not $allFound) {
            Write-Host "##[warning]Some VC runtime DLLs are missing from the NSIS installer"
          }

      - name: Find MSI installer
        id: find-msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($msi) {
            Write-Host "Found MSI: $($msi.FullName) (modified $($msi.LastWriteTime))"
            "msi_path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "msi_name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "No MSI found"
          }

      - name: Find NSIS installer
        id: find-nsis
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($exe) {
            Write-Host "Found NSIS EXE: $($exe.FullName) (modified $($exe.LastWriteTime))"
            "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "No NSIS EXE found"
          }

      - name: Upload MSI installer
        if: steps.find-msi.outputs.msi_path
        uses: actions/upload-artifact@v4
        with:
          name: anarlog-windows-msi
          path: ${{ steps.find-msi.outputs.msi_path }}

      - name: Upload NSIS installer
        if: steps.find-nsis.outputs.exe_path
        uses: actions/upload-artifact@v4
        with:
          name: anarlog-windows-nsis
          path: ${{ steps.find-nsis.outputs.exe_path }}
          if-no-files-found: error
