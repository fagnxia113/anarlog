name: Build zhnote (Windows)

on:
  push:
    branches:
      - main
    paths:
      - "apps/zhnote/**"
      - ".github/workflows/build-zhnote.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/zhnote/**"
      - ".github/workflows/build-zhnote.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build zhnote (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: pwsh
        run: |
          $storePath = pnpm store path
          "STORE_PATH=$storePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-zhnote-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-zhnote-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-zhnote-cargo-registry-${{ hashFiles('apps/zhnote/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-zhnote-cargo-registry-

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            apps/zhnote/src-tauri/target/release
          key: ${{ runner.os }}-zhnote-cargo-build-${{ hashFiles('apps/zhnote/src-tauri/Cargo.lock', 'apps/zhnote/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-zhnote-cargo-build-

      - name: Clean stale bundle artifacts from cache
        shell: pwsh
        run: |
          $staleDirs = @(
            "apps/zhnote/src-tauri/target/release/bundle",
            "apps/zhnote/src-tauri/target/release/nsis",
            "apps/zhnote/src-tauri/target/release/wix"
          )
          foreach ($d in $staleDirs) {
            if (Test-Path $d) {
              Write-Host "Removing stale: $d"
              Remove-Item -Recurse -Force $d
            }
          }

      - name: Build zhnote (Windows)
        working-directory: apps/zhnote
        run: pnpm tauri build --ci --no-sign --verbose

      - name: List build artifacts
        shell: pwsh
        run: |
          Write-Host "=== Bundle directory ==="
          Get-ChildItem -Path "apps/zhnote/src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Find NSIS installer
        id: find-nsis
        if: always()
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "apps/zhnote/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($exe) {
            Write-Host "Found NSIS EXE: $($exe.FullName) (modified $($exe.LastWriteTime))"
            "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "No NSIS EXE found"
          }

      - name: Upload NSIS installer
        if: always() && steps.find-nsis.outputs.exe_path
        uses: actions/upload-artifact@v4
        with:
          name: zhnote-windows-nsis
          path: ${{ steps.find-nsis.outputs.exe_path }}
          if-no-files-found: error
