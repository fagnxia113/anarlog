[package]
name = "zhnote"
version = "0.2.0"
edition = "2021"
rust-version = "1.94.0"
description = "Chinese-first smart notes"

[lib]
name = "zhnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1"
bzip2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.4"
tauri-plugin-http = "2.5"
tauri-plugin-os = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-store = "2.4.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
